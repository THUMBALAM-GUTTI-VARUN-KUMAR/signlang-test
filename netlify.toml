# Netlify Deployment Configuration for SignAI Studio

[build]
  publish = "."
  command = "echo 'Static build complete'"

[build.environment]
  PIP_REQUIREMENTS_PATH = ""
  PYTHON_VERSION = "3.10"
  NETLIFY_USE_PYTHON = "false"
  PIP_NO_REQUIREMENTS = "1"

[[redirects]]
  from = "/"
  to = "/templates/landing.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/templates/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

